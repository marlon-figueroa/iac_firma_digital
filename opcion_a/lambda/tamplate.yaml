AWSTemplateFormatVersion: "2010-09-09"
Description: "Lambdas de opcion-a — Graviton, fuera de la VPC salvo CloudHSM, codigo embebido."
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: "API prefirma PUT, S3 sin-firmar avisa a SQS y Lambda firma con KMS hacia firmados"
    must:
      - "Handler index.handler porque ZipFile se publica como index.py"
      - "Log group con retencion de 30 dias creado antes que la funcion"
    ref:
      - at: context/compartido.yaml
        has: convenciones comunes de cifrado, custodia y carpetas
        scope: shared
      - at: requerimientos.txt
        has: pedido de vias asincronas y endpoint sincrono
        scope: shared

Parameters:
  ProjectName:
    Type: String
    Default: firma-digital
    AllowedPattern: "^[a-z0-9-]{1,20}$"
    Description: Prefijo de nombres. Minusculas, numeros y guion.
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
    Description: Entorno. Tambien es el nombre del stage de API Gateway.

  DeployCloudHsm:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: true crea dos HSM y asocia las Lambdas a la VPC. Cada HSM se cobra por hora.

  UnsignedPrefix:
    Type: String
    Default: sin-firmar/
    AllowedPattern: "^sin-firmar/$"
    Description: Prefijo de entrada. La regla de 7 dias usa este valor.
  SignedPrefix:
    Type: String
    Default: firmados/
    AllowedPattern: "^firmados/$"
    Description: Prefijo de salida de los PDF firmados.
  CorsAllowedOrigin:
    Type: String
    Default: https://localhost
    AllowedPattern: "^https://.+"
    Description: Origen permitido en CORS. En produccion usar el dominio real.

  SubnetA:
    Type: String
    Description: Subred privada A. Se usa si DeployCloudHsm=true.
  SubnetB:
    Type: String
    Description: Subred privada B. Se usa si DeployCloudHsm=true.
  LambdaSecurityGroupId:
    Type: String
    Description: Security group de salida de las Lambdas.

  BucketName:
    Type: String
    Description: Nombre del bucket de documentos.
  KeyArn:
    Type: String
    Description: ARN de la llave de firma.
  QueueArn:
    Type: String
    Description: ARN de la cola de trabajo.
  PresignRoleArn:
    Type: String
    Description: Rol de la Lambda que emite la URL.
  SignerRoleArn:
    Type: String
    Description: Rol de la Lambda que firma.

Conditions:
  UseHsm: !Equals [!Ref DeployCloudHsm, "true"]

Resources:

  APresignLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectName}-${Environment}-a-presign
      RetentionInDays: 30
  APresignFunction:
    Type: AWS::Lambda::Function
    DependsOn: APresignLogGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: "Entrega una URL de PUT de 15 minutos. No firma."
        must:
          - "arm64"
          - "ZipFile bajo 4 KB"
          - "VpcConfig solo con DeployCloudHsm=true"
    Properties:
      FunctionName: !Sub ${ProjectName}-${Environment}-a-presign
      Role: !Ref PresignRoleArn
      Runtime: python3.12
      Architectures:
        - arm64
      Handler: index.handler
      Timeout: 10
      MemorySize: 256
      Code:
        ZipFile: |
          import json
          import os
          import uuid

          import boto3

          s3 = boto3.client("s3")
          BUCKET = os.environ["BUCKET"]
          PREFIX = os.environ["UNSIGNED_PREFIX"]
          ORIGIN = os.environ["CORS_ORIGIN"]


          def handler(event, context):
              headers = {
                  "Content-Type": "application/json",
                  "Access-Control-Allow-Origin": ORIGIN,
              }
              try:
                  body = json.loads(event.get("body") or "{}")
              except json.JSONDecodeError:
                  return {"statusCode": 400, "headers": headers, "body": json.dumps({"error": "JSON invalido"})}
              if body.get("nombre") and not str(body["nombre"]).endswith(".pdf"):
                  return {"statusCode": 400, "headers": headers, "body": json.dumps({"error": "el nombre debe terminar en .pdf"})}
              doc_id = str(uuid.uuid4())
              key = f"{PREFIX}{doc_id}.pdf"
              url = s3.generate_presigned_url(
                  ClientMethod="put_object",
                  Params={"Bucket": BUCKET, "Key": key, "ContentType": "application/pdf"},
                  ExpiresIn=900,
              )
              payload = {"id": doc_id, "clave": key, "url": url, "expiraEn": 900, "contentType": "application/pdf"}
              return {"statusCode": 200, "headers": headers, "body": json.dumps(payload)}
      Environment:
        Variables:
          BUCKET: !Ref BucketName
          UNSIGNED_PREFIX: !Ref UnsignedPrefix
          SIGNED_PREFIX: !Ref SignedPrefix
          KMS_KEY_ID: !Ref KeyArn
          CORS_ORIGIN: !Ref CorsAllowedOrigin
      VpcConfig: !If
        - UseHsm
        - SecurityGroupIds:
            - !Ref LambdaSecurityGroupId
          SubnetIds:
            - !Ref SubnetA
            - !Ref SubnetB
        - !Ref AWS::NoValue
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Option
          Value: opcion-a

  AFirmarLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectName}-${Environment}-a-firmar
      RetentionInDays: 30
  AFirmarFunction:
    Type: AWS::Lambda::Function
    DependsOn: AFirmarLogGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: "Consume SQS, firma el hash y escribe firmados. Devuelve fallos parciales."
        must:
          - "arm64"
          - "ZipFile bajo 4 KB"
          - "VpcConfig solo con DeployCloudHsm=true"
    Properties:
      FunctionName: !Sub ${ProjectName}-${Environment}-a-firmar
      Role: !Ref SignerRoleArn
      Runtime: python3.12
      Architectures:
        - arm64
      Handler: index.handler
      Timeout: 60
      MemorySize: 1024
      Code:
        ZipFile: |
          import base64
          import hashlib
          import os

          import boto3
          from botocore.exceptions import ClientError

          s3 = boto3.client("s3")
          kms = boto3.client("kms")
          BUCKET = os.environ["BUCKET"]
          SIGNED = os.environ["SIGNED_PREFIX"]
          KEY_ID = os.environ["KMS_KEY_ID"]


          def already(key):
              try:
                  s3.head_object(Bucket=BUCKET, Key=key)
                  return True
              except ClientError as exc:
                  if exc.response["Error"]["Code"] in ("404", "NoSuchKey", "NotFound"):
                      return False
                  raise


          def sign_bytes(doc_id, data):
              out = f"{SIGNED}{doc_id}.pdf"
              if already(out):
                  return out
              digest = hashlib.sha256(data).digest()
              sig = kms.sign(
                  KeyId=KEY_ID,
                  Message=digest,
                  MessageType="DIGEST",
                  SigningAlgorithm="ECDSA_SHA_256",
              )["Signature"]
              s3.put_object(
                  Bucket=BUCKET,
                  Key=out,
                  Body=data,
                  ContentType="application/pdf",
                  Metadata={"firma-sha256": digest.hex(), "firma-kms": base64.b64encode(sig).decode()},
              )
              s3.put_object(Bucket=BUCKET, Key=out + ".sig", Body=sig)
              return out


          import json
          from urllib.parse import unquote_plus

          UNSIGNED = os.environ["UNSIGNED_PREFIX"]


          def handler(event, context):
              failures = []
              for rec in event.get("Records", []):
                  try:
                      body = json.loads(rec["body"])
                      for item in body.get("Records", []):
                          key = unquote_plus(item["s3"]["object"]["key"])
                          if not key.startswith(UNSIGNED) or not key.endswith(".pdf"):
                              continue
                          doc_id = key.rsplit("/", 1)[-1][:-4]
                          data = s3.get_object(Bucket=BUCKET, Key=key)["Body"].read()
                          sign_bytes(doc_id, data)
                  except Exception as exc:
                      print(f"fallo {rec.get('messageId')}: {exc}")
                      failures.append({"itemIdentifier": rec["messageId"]})
              return {"batchItemFailures": failures}
      Environment:
        Variables:
          BUCKET: !Ref BucketName
          UNSIGNED_PREFIX: !Ref UnsignedPrefix
          SIGNED_PREFIX: !Ref SignedPrefix
          KMS_KEY_ID: !Ref KeyArn
          CORS_ORIGIN: !Ref CorsAllowedOrigin
      VpcConfig: !If
        - UseHsm
        - SecurityGroupIds:
            - !Ref LambdaSecurityGroupId
          SubnetIds:
            - !Ref SubnetA
            - !Ref SubnetB
        - !Ref AWS::NoValue
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Option
          Value: opcion-a

  SignerMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !Ref QueueArn
      FunctionName: !Ref AFirmarFunction
      BatchSize: 5
      MaximumBatchingWindowInSeconds: 5
      FunctionResponseTypes:
        - ReportBatchItemFailures

Outputs:

  PresignFunctionArn:
    Value: !GetAtt APresignFunction.Arn
  SignerFunctionArn:
    Value: !GetAtt AFirmarFunction.Arn
