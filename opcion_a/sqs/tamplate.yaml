AWSTemplateFormatVersion: "2010-09-09"
Description: "Colas de opcion-a — SSE-SQS y retencion de 14 dias."
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: "API prefirma PUT, S3 sin-firmar avisa a SQS y Lambda firma con KMS hacia firmados"
    must:
      - "La cola de trabajo no acepta SendMessage de S3 de otra cuenta"
    ref:
      - at: context/compartido.yaml
        has: convenciones comunes de cifrado, custodia y carpetas
        scope: shared
      - at: requerimientos.txt
        has: pedido de vias asincronas y endpoint sincrono
        scope: shared

Parameters:
  ProjectName:
    Type: String
    Default: firma-digital
    AllowedPattern: "^[a-z0-9-]{1,20}$"
    Description: Prefijo de nombres. Minusculas, numeros y guion.
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
    Description: Entorno. Tambien es el nombre del stage de API Gateway.

Resources:
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Metadata:
      com.aws.cloudformation.Context:
        why: "Aisla mensajes que la Lambda no pudo firmar."
        must:
          - "SSE-SQS encendido"
          - "Retencion 14 dias"
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Option
          Value: opcion-a

  WorkQueue:
    Type: AWS::SQS::Queue
    Metadata:
      com.aws.cloudformation.Context:
        why: "Cola de trabajo entre el aviso de S3 y la Lambda. La DLQ recibe el mensaje tras 3 intentos."
        must:
          - "Cifrado SSE-SQS"
          - "VisibilityTimeout 360 >= timeout de la Lambda"
          - "S3 solo puede enviar si aws:SourceAccount es esta cuenta"
    Properties:
      VisibilityTimeout: 360
      MessageRetentionPeriod: 1209600
      ReceiveMessageWaitTimeSeconds: 10
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Option
          Value: opcion-a
  WorkQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref WorkQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3SameAccount
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt WorkQueue.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

Outputs:

  QueueArn:
    Value: !GetAtt WorkQueue.Arn
  QueueUrl:
    Value: !Ref WorkQueue
  DlqArn:
    Value: !GetAtt DeadLetterQueue.Arn
  DlqUrl:
    Value: !Ref DeadLetterQueue
